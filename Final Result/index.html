<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- NOTE: the app name is written exactly as you gave it (POKEEXPLOROR).
         If you meant "POKEEXPLORER", change it here and in the <h1> below. -->
    <title>POKEEXPLOROR</title>

    <!-- Fonts: "Press Start 2P" for the title, "Fredoka" for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <!-- REQUIREMENT 1: register / login page built with HTML + CSS -->
        <header class="brand">
            <div class="lights" aria-hidden="true">
                <span class="light light-blue"></span>
                <span class="light light-red"></span>
                <span class="light light-yellow"></span>
                <span class="light light-green"></span>
            </div>
            <h1>POKEEXPLOROR</h1>
            <p class="tagline">Trainer Login</p>
        </header>

        <!-- DO NOT change the ids below (email, password, signupBtn, loginBtn,
             message, googleBtn, userInfo, userEmail, userUID, userProvider, logoutBtn):
             app.js looks elements up by these ids. -->
        <section class="screen">

            <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="email">
            <input type="password" id="password" placeholder="Password" aria-label="Password"
                autocomplete="current-password">

            <p class="hint">Password: at least 6 characters, with an uppercase letter, a lowercase letter and a
                number.</p>

            <div class="button-row">
                <button id="signupBtn">Sign Up</button>
                <button id="loginBtn">Log In</button>
            </div>

            <!-- REQUIREMENT 4: success / error messages appear here.
                 Empty = hidden (see style.css). -->
            <p id="message" class="message" role="status" aria-live="polite"></p>

            <hr>

            <!-- REQUIREMENT 6 (Advance): Google login -->
            <button id="googleBtn">Log In With Google</button>

            <!-- REQUIREMENT 5 (Bonus): shows the user's email after a successful login.
                 Hidden by default (see style.css); app.js shows it. -->
            <div id="userInfo">
                <h3>Trainer Card</h3>

                <p>Email: <span id="userEmail"></span></p>
                <p>UID: <span id="userUID"></span></p>
                <p>Provider: <span id="userProvider"></span></p>

                <button id="logoutBtn">Log Out</button>
            </div>

        </section>
    </main>

    <!-- REQUIREMENT 2: Firebase connected through the SDK as <script> tags
         (compat version, works with the firebase.* syntax) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <!-- ORDER MATTERS: firebase-config.js creates `auth`, app.js uses it. -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
